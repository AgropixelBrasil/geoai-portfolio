<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/L.Control.Locate.min.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>Agropixel | Geospatial Infrastructure Demonstration</title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/L.Control.Locate.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="data/reapermevel_2.js"></script>
        <script src="data/EixodaLT_3.js"></script>
        <script src="data/Faixadedomnio_4.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-21.18841870251397,-47.791325460836894],[-21.17573073366761,-47.770864851910936]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // add class to format popup if it contains media
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					// Delay to force the redraw
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}
		}
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_GoogleSatellite_0');
        map.getPane('pane_GoogleSatellite_0').style.zIndex = 400;
        var layer_GoogleSatellite_0 = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_GoogleSatellite_0',
            opacity: 1.0,
            attribution: '&copy; OpenStreetMap contributors',
            minZoom: 1,
            maxZoom: 28,
        });
        layer_GoogleSatellite_0;
        map.addLayer(layer_GoogleSatellite_0);
        map.createPane('pane_Ortomosaico_1');
        map.getPane('pane_Ortomosaico_1').style.zIndex = 401;
        var img_Ortomosaico_1 = 'data/Ortomosaico_1.webp';
        var img_bounds_Ortomosaico_1 = [[-21.188564784193666,-47.787211054924256],[-21.176674182368725,-47.77946361899761]];
        var layer_Ortomosaico_1 = new L.imageOverlay(img_Ortomosaico_1,
                                              img_bounds_Ortomosaico_1,
                                              {pane: 'pane_Ortomosaico_1'});
        bounds_group.addLayer(layer_Ortomosaico_1);
        function pop_reapermevel_2(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">id</th>\
                        <td class="visible-with-data" id="id">' + (feature.properties['id'] !== null ? autolinker.link(String(feature.properties['id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">area</th>\
                        <td>' + (feature.properties['area'] !== null ? autolinker.link(String(feature.properties['area']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_reapermevel_2_0() {
            return {
                pane: 'pane_reapermevel_2',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(227,26,28,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_reapermevel_2');
        map.getPane('pane_reapermevel_2').style.zIndex = 402;
        map.getPane('pane_reapermevel_2').style['mix-blend-mode'] = 'normal';
        var layer_reapermevel_2 = new L.geoJson(json_reapermevel_2, {
            attribution: '',
            interactive: true,
            dataVar: 'json_reapermevel_2',
            layerName: 'layer_reapermevel_2',
            pane: 'pane_reapermevel_2',
            onEachFeature: pop_reapermevel_2,
            style: style_reapermevel_2_0,
        });
        bounds_group.addLayer(layer_reapermevel_2);
        map.addLayer(layer_reapermevel_2);
        function pop_EixodaLT_3(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['id'] !== null ? autolinker.link(String(feature.properties['id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_EixodaLT_3_0() {
            return {
                pane: 'pane_EixodaLT_3',
                opacity: 1,
                color: 'rgba(242,254,6,1.0)',
                dashArray: '8.0,4.0',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 2.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_EixodaLT_3');
        map.getPane('pane_EixodaLT_3').style.zIndex = 403;
        map.getPane('pane_EixodaLT_3').style['mix-blend-mode'] = 'normal';
        var layer_EixodaLT_3 = new L.geoJson(json_EixodaLT_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_EixodaLT_3',
            layerName: 'layer_EixodaLT_3',
            pane: 'pane_EixodaLT_3',
            onEachFeature: pop_EixodaLT_3,
            style: style_EixodaLT_3_0,
        });
        bounds_group.addLayer(layer_EixodaLT_3);
        map.addLayer(layer_EixodaLT_3);
        function pop_Faixadedomnio_4(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['id'] !== null ? autolinker.link(String(feature.properties['id']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['id_2'] !== null ? autolinker.link(String(feature.properties['id_2']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Faixadedomnio_4_0() {
            return {
                pane: 'pane_Faixadedomnio_4',
                opacity: 1,
                color: 'rgba(0,255,59,1.0)',
                dashArray: '2.0,4.0',
                lineCap: 'square',
                lineJoin: 'bevel',
                weight: 2.0,
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_Faixadedomnio_4');
        map.getPane('pane_Faixadedomnio_4').style.zIndex = 404;
        map.getPane('pane_Faixadedomnio_4').style['mix-blend-mode'] = 'normal';
        var layer_Faixadedomnio_4 = new L.geoJson(json_Faixadedomnio_4, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Faixadedomnio_4',
            layerName: 'layer_Faixadedomnio_4',
            pane: 'pane_Faixadedomnio_4',
            onEachFeature: pop_Faixadedomnio_4,
            style: style_Faixadedomnio_4_0,
        });
        bounds_group.addLayer(layer_Faixadedomnio_4);
        map.addLayer(layer_Faixadedomnio_4);
        var overlaysTree = [
            {label: '<img src="legend/Faixadedomnio_4.png" /> Faixa de domínio', layer: layer_Faixadedomnio_4},
            {label: '<img src="legend/EixodaLT_3.png" /> Eixo da LT', layer: layer_EixodaLT_3},
            {label: '<img src="legend/reapermevel_2.png" /> Área permeável', layer: layer_reapermevel_2},
            {label: "Ortomosaico", layer: layer_Ortomosaico_1},
            {label: "Google Satellite", layer: layer_GoogleSatellite_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();
        var i = 0;
        layer_reapermevel_2.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((exp_label_reapermevel_2_eval_expression(context) !== null?String('<div style="color: #ffffff; font-size: 10pt; font-family: \'Montserrat\', sans-serif;">' + exp_label_reapermevel_2_eval_expression(context)) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_reapermevel_2'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        L.ImageOverlay.include({
            getBounds: function () {
                return this._bounds;
            }
        });
        resetLabels([layer_reapermevel_2]);
        map.on("zoomend", function(){
            resetLabels([layer_reapermevel_2]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_reapermevel_2]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_reapermevel_2]);
        });
        </script>
    <div style="position:fixed;z-index:1000;right:10px;top:10px;max-width:290px;background:rgba(9,31,43,.91);color:white;padding:10px 13px;border-radius:7px;font:12px Arial,sans-serif;box-shadow:0 3px 14px rgba(0,0,0,.2)">
<strong style="color:#83c327">AGROPIXEL</strong> · Public WebGIS preview
<div style="opacity:.85;margin-top:3px">Transmission-line corridor vegetation survey · mapped polygons, rights of way and UAV mosaic</div>
<a href="../index.html" style="color:#c4e6ff">Case study</a>
</div></body>
</html>
